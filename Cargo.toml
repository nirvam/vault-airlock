[package]
name = "vault-airlock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
atty = "0.2.14"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
dialoguer = "0.12.0"
futures-util = "0.3.32"
keepass = { version = "0.12.0", features = ["utilities"] }
reqwest = { version = "0.13.2", features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["net"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.17.1"
tokio-test = "0.4.4"
